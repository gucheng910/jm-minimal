<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 主题色（状态栏 / 浏览器外框）：**只留一条，由 JS 按「实际生效」的主题维护**。
         原来这里是两条 media="(prefers-color-scheme: …)" 的 meta —— 那只能跟随**系统**主题，
         而本 App 的主题是用户可以覆盖的（抽屉里的「深色模式」；core/theme.ts 的规则是
         "用户显式选过就永远听用户的"）。用户一覆盖两边就不同步：整屏变暗、状态栏留在暖白。
         写入点有两处，都必须与 core/theme.ts 的 initialDark() 同判定：
           ① 下面那段内联脚本（首帧，避免闪一下）；
           ② src/App.tsx 的主题 effect（用户切换时）。 -->
    <meta name="theme-color" content="#F2F0E5" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- 首帧定主题：用户显式选过听用户的，没选过跟随系统。
         必须与 src/core/theme.ts 的 initialDark() 保持一致，否则会先闪一下白再变暗。 -->
    <script>try{var t=localStorage.getItem("jmclient.theme");var d=t==="dark"||(t!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.setAttribute("data-theme","dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",d?"#100F0F":"#F2F0E5");}catch(e){}</script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <title>JM极简版</title>
    <style>
      /* 老内核兜底页：与主界面同一套纸墨色与字号刻度（正文 14 / 标题 18） */
      #jm-old-webview { max-width: 476px; margin: 15vh auto 0; padding: 0 20px; font: 14px/1.75 -apple-system, "Segoe UI", Roboto, sans-serif; color: #100F0F; background: #F2F0E5; }
      #jm-old-webview h1 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
      #jm-old-webview p { margin: 0 0 10px; color: #575653; }
      @media (prefers-color-scheme: dark) { #jm-old-webview { color: #CECDC3; background: #100F0F; } #jm-old-webview p { color: #9F9D96; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 老内核兜底：模块脚本与 legacy 包都要求 Promise/fetch 等基础能力；
         完全不具备时给出可读提示，而不是白屏（ES5 语法，老引擎也能执行） -->
    <div id="jm-old-webview" hidden>
      <h1>系统 WebView 版本过低</h1>
      <p>本应用需要较新的系统 WebView（Chromium 61 以上，建议 80 以上）。</p>
      <p>请到应用商店更新「Android System WebView」（华为/荣耀机型为「华为浏览器内核」或系统更新），然后重新打开本应用。</p>
    </div>
    <script>
      (function () {
        var ok = window.Promise && window.fetch && window.Symbol && window.Object && Object.assign &&
          Array.prototype.includes && window.URL && window.URLSearchParams;
        if (!ok) {
          var el = document.getElementById("jm-old-webview");
          if (el) el.hidden = false;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
