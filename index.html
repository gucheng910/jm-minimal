<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F0E5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100F0F" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>try{var t=localStorage.getItem("jmclient.theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <title>JM极简版</title>
    <style>
      /* 老内核兜底页：与主界面同一套纸墨色与字号刻度（正文 14 / 标题 18） */
      #jm-old-webview { max-width: 476px; margin: 15vh auto 0; padding: 0 20px; font: 14px/1.75 -apple-system, "Segoe UI", Roboto, sans-serif; color: #100F0F; background: #F2F0E5; }
      #jm-old-webview h1 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
      #jm-old-webview p { margin: 0 0 10px; color: #575653; }
      @media (prefers-color-scheme: dark) { #jm-old-webview { color: #CECDC3; background: #100F0F; } #jm-old-webview p { color: #9F9D96; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 老内核兜底：模块脚本与 legacy 包都要求 Promise/fetch 等基础能力；
         完全不具备时给出可读提示，而不是白屏（ES5 语法，老引擎也能执行） -->
    <div id="jm-old-webview" hidden>
      <h1>系统 WebView 版本过低</h1>
      <p>本应用需要较新的系统 WebView（Chromium 61 以上，建议 80 以上）。</p>
      <p>请到应用商店更新「Android System WebView」（华为/荣耀机型为「华为浏览器内核」或系统更新），然后重新打开本应用。</p>
    </div>
    <script>
      (function () {
        var ok = window.Promise && window.fetch && window.Symbol && window.Object && Object.assign &&
          Array.prototype.includes && window.URL && window.URLSearchParams;
        if (!ok) {
          var el = document.getElementById("jm-old-webview");
          if (el) el.hidden = false;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
